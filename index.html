    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:      #50D8FF;
      --accent-dim:  rgba(80,216,255,0.14);
      --accent-glow: rgba(80,216,255,0.30);
      --bg:          #081828;
      --bg2:         #0C2240;
      --bg3:         #102848;
      --bg4:         #163258;
      --border:      rgba(80,216,255,0.12);
      --border2:     rgba(80,216,255,0.22);
      --text:        #F0F8FF;
      --text2:       #90C4E8;
      --text3:       #5090B8;
      --topbar-h:    58px;
      --sidebar-w:   244px;
      --r:           10px;
    }

    html { scroll-behavior: smooth; overflow-x: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }

    /* ── TOPBAR ──────────────────────────────── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: rgba(1,10,24,0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      z-index: 300;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 14px;
    }

    .ham-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      padding: 7px;
      border-radius: 7px;
      flex-shrink: 0;
      transition: color .15s, background .15s;
    }
    .ham-btn:hover { color: var(--text); background: var(--bg3); }
    .ham-btn svg { display: block; width: 20px; height: 20px; }

    .logo {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .logo-cassius { color: var(--text); }
    .logo-break   { color: var(--accent); }

    .topbar-spacer { flex: 1; }

    .topbar-search {
      width: 340px;
      flex-shrink: 0;
      position: relative;
    }
    .topbar-search svg {
      position: absolute;
      left: 11px;
      top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px;
      color: var(--text3);
      pointer-events: none;
    }
    .topbar-search input {
      width: 100%;
      height: 36px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.86rem;
      padding: 0 12px 0 34px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .topbar-search input::placeholder { color: var(--text3); }
    .topbar-search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    /* ── LAYOUT ─────────────────────────────── */
    .layout {
      display: flex;
      padding-top: var(--topbar-h);
      min-height: 100vh;
    }

    /* ── SIDEBAR ─────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: fixed;
      top: var(--topbar-h);
      left: 0;
      bottom: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      padding: 12px 0 40px;
      scrollbar-width: thin;
      scrollbar-color: var(--bg4) transparent;
      z-index: 200;
      transition: transform .24s cubic-bezier(.4,0,.2,1);
    }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

    .sidebar-section { margin-bottom: 2px; }

    .sidebar-cat {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 14px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text2);
      cursor: pointer;
      user-select: none;
      transition: color .14s, background .14s;
      border-radius: 0;
    }
    .sidebar-cat:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .sidebar-cat.active-section { color: var(--accent); }

    .sidebar-cat .cat-icon { font-size: 0.85rem; line-height: 1; }
    .sidebar-cat .cat-label { flex: 1; }

    .chevron {
      width: 13px; height: 13px;
      flex-shrink: 0;
      color: var(--text3);
      transition: transform .2s;
    }
    .sidebar-section.open .chevron { transform: rotate(90deg); }

    .sidebar-games {
      overflow: hidden;
      max-height: 0;
      transition: max-height .25s ease;
    }
    .sidebar-section.open .sidebar-games { max-height: 500px; }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 14px 6px 26px;
      font-size: 0.82rem;
      color: var(--text2);
      transition: color .14s, background .14s;
    }
    .sidebar-link:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .sidebar-link.is-original { color: var(--accent); }
    .sidebar-link.is-original:hover { color: #33bbff; }
    .sidebar-link.is-soon { opacity: 0.45; pointer-events: none; }

    .link-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--text3);
      flex-shrink: 0;
    }
    .sidebar-link.is-original .link-dot { background: var(--accent); }

    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 14px;
    }

    /* ── SIDEBAR OVERLAY (mobile) ─────────────── */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 199;
      opacity: 0;
      transition: opacity .24s;
    }
    .sidebar-overlay.open { opacity: 1; }

    /* ── MAIN ────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-width: 0;
      padding: 24px 0 64px;
    }

    .ad-slot { margin: 0 26px 24px; }

    /* ── AD SLOT ─────────────────────────────── */
    .ad-slot {
      width: 100%;
      max-width: 728px;
      height: 90px;
      background: var(--bg2);
      border: 1px dashed var(--border2);
      border-radius: var(--r);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text3);
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 28px;

    /* ── SECTION ROW ─────────────────────────── */

    .game-section:nth-child(even) { background: #0C1E38; }

    .sec-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .sec-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--text3);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .sec-dot {
      display: inline-block;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--text3);
      flex-shrink: 0;
    }
    .sec-star {
      font-size: 0.72rem;
      color: var(--accent);
    }
    .sec-count { display: none; }

    /* ── SECTION HEADS hidden ────────────────── */
    .sec-head { display: none; }

    /* ── PURPLE BANNER ───────────────────────── */

      background: linear-gradient(90deg, #5B21B6, #7C3AED, #9333EA);
      padding: 18px 26px;
      text-align: center;
      margin-bottom: 0;
    }
    .hero-banner h1 {
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
    }

    /* ── CARDS GRID ──────────────────────────── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }

    /* ── GAME CARD ───────────────────────────── */
    .game-card {
      border-radius: var(--r);
      overflow: hidden;
      background: var(--bg3);
      border: 1px solid var(--border2);
      display: block;
      transition: border-color .15s;
    }
    a.game-card:hover {
      border-color: rgba(0,191,255,0.45);
    }

    .card-thumb {
      aspect-ratio: 16/10;
      overflow: hidden;
    }
    .card-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Placeholder thumb backgrounds */
    .ph-action  { background: #001D3D; }
    .ph-puzzle  { background: #001828; }
    .ph-racing  { background: #001530; }
    .ph-shooter { background: #001A38; }
    .ph-sports  { background: #00122A; }
    .ph-arcade  { background: #001830; }
    .ph-skill   { background: #001428; }
    .ph-io      { background: #001C3C; }

    .ph-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ph-icon {
      font-size: 1.8rem;
      opacity: 0.25;
    }

    /* Card info */
    .card-info {
      padding: 7px 10px 9px;
    }
    .card-name {
      font-size: 0.84rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .game-card.is-soon .card-name { color: var(--text3); }

    /* ── SEARCH RESULTS ──────────────────────── */
    .search-panel { display: none; }
    .search-panel.active { display: block; }
    .search-panel .sec-head { margin-bottom: 14px; }
    #search-query-label { color: var(--accent); }

    .no-results {
      padding: 48px 0;
      text-align: center;
      color: var(--text2);
      font-size: 0.95rem;
    }

    /* ── FOOTER ──────────────────────────────── */
    footer {
      margin-left: var(--sidebar-w);
      border-top: 1px solid var(--border);
      padding: 22px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text3);
      font-size: 0.78rem;
      flex-wrap: wrap;
      gap: 10px;
    }
    footer a { color: var(--text2); transition: color .14s; }
    footer a:hover { color: var(--accent); }
    .footer-links { display: flex; gap: 20px; }

    /* ── RESPONSIVE ──────────────────────────── */
    @media (max-width: 1100px) {
      .cards-grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 768px) {
      .ham-btn { display: flex; align-items: center; justify-content: center; }

      .sidebar {
        transform: translateX(calc(-1 * var(--sidebar-w)));
        box-shadow: none;
        z-index: 250;
      }
      .sidebar.open {
        transform: translateX(0);
        box-shadow: 6px 0 24px rgba(0,0,0,0.55);
      }
      .sidebar-overlay { display: block; pointer-events: none; }
      .sidebar-overlay.open { pointer-events: auto; }

      .main { margin-left: 0; padding: 18px 0 56px; }
      footer { margin-left: 0; padding: 18px 14px; }

      .topbar-search { width: auto; flex: 1; }
      .topbar-spacer { display: none; }
    }

    @media (max-width: 520px) {
      .cards-grid { grid-template-columns: repeat(3, 1fr); }
      .logo { font-size: 1.1rem; }
      .ad-slot { height: 60px; font-size: 0.58rem; }
    }

    /* reduce motion */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .game-card, .sidebar, .chevron { transition: none; }
    }

</head>

      games: ['combat-zone', 'ninja-dash', 'mech-assault', 'cyber-punch', 'bot-wars', 'rush-blast']
    },
    {
      id: 'puzzle',
      title: 'Puzzle',
      games: ['block-drop', '2048', 'minesweeper', 'cube-maze', 'bubble-pop', 'flip-it', 'color-match', 'gem-quest']
    },
    {
      id: 'racing',
      title: 'Racing',
      games: ['drift-kings', 'hyper-kart', 'speed-trials', 'stunt-race', 'sky-race', 'goal-rush']
    },
    {
      id: 'shooters',
      title: 'Shooters',
      games: ['pixel-strike', 'rush-blast', 'space-chain', 'star-blast', 'shadow-strike', 'combat-zone']
    },
    {
      id: 'sports',
      title: 'Sports',
      games: ['goal-rush', 'basket-jam', 'pool-rush', 'surf-rider', 'power-tennis', 'turbo-ball']
    },
    {
      id: 'arcade',
      title: 'Arcade',
      games: ['speed-runner', 'snake', 'flappy-bird', 'neon-pong', 'coin-dash', 'dino-jump', 'blitz-ball']
    },
    {
      id: 'skill',
      title: 'Skill',
      games: ['slope', 'tower-climb', 'ninja-dash', 'maze-run', 'lava-run', 'word-rush']
    },
    {
      id: 'io-games',
      title: '.io Games',
      games: ['snake-arena', 'io-swarm', 'io-merge', 'io-battle', 'combat-zone', 'star-blast']
    },
  ];

  /* ── SIDEBAR CATEGORIES ── */
  const SIDEBAR_CATS = [
    { icon: '🏎', label: 'Driving Games', sectionId: 'racing',
      games: ['drift-kings', 'hyper-kart', 'speed-trials', 'stunt-race', 'sky-race', 'goal-rush'] },
    { icon: '🔫', label: 'Shooters',      sectionId: 'shooters',
      games: ['pixel-strike', 'rush-blast', 'space-chain', 'star-blast', 'shadow-strike', 'combat-zone'] },
  ];

  const PLAY_URL = id => '/game.html?game=' + id;

  /* ── ICON SVGs ── */
  const SVG_CHEVRON = `<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>`;

  /* ── BUILD CARD HTML ── */
  function buildCard(gameId) {
    const g = GAMES[gameId];
    if (!g) return '';

    const isSoon = g.soon;

    let thumbHtml;
    if (g.playable && g.img) {
      thumbHtml = `<div class="card-thumb"><img src="${g.img}" alt="${g.name}" loading="lazy" width="320" height="200"></div>`;
    } else {
      thumbHtml = `<div class="card-thumb ${g.ph || 'ph-skill'}"><div class="ph-inner"><div class="ph-icon">${g.icon || '🎮'}</div></div></div>`;
    }

    const info = `<div class="card-info"><div class="card-name">${g.name}</div></div>`;

    if (isSoon) {
      return `<div class="game-card is-soon">${thumbHtml}${info}</div>`;
    }
    return `<a class="game-card" href="${PLAY_URL(gameId)}">${thumbHtml}${info}</a>`;
  }

  /* ── RENDER SECTIONS ── */
  const container = document.getElementById('sections-container');
  container.innerHTML = SECTIONS.map(sec => {
    const titleIcon = sec.star
      ? `<span class="sec-star">★</span> ${sec.title}`
      : sec.dot
        ? `<span class="sec-dot" aria-hidden="true"></span>${sec.title}`
        : sec.title;

    return `
      <section class="game-section" id="${sec.id}" aria-labelledby="sec-${sec.id}">
        <div class="sec-head">
          <h2 class="sec-title" id="sec-${sec.id}">${titleIcon}</h2>
          <span class="sec-count">${sec.games.length} games</span>
        </div>
        <div class="cards-grid">
          ${sec.games.map(buildCard).join('')}
        </div>
      </section>`;
  }).join('');

  /* ── RENDER SIDEBAR ── */
  const nav = document.getElementById('sidebar-nav');

  function buildSidebarLink(gid) {
    const g = GAMES[gid];
    if (!g) return '';
    const cls = g.original ? 'sidebar-link is-original' : g.soon ? 'sidebar-link is-soon' : 'sidebar-link';
    const tag = g.playable ? 'a' : 'span';
    const href = g.playable ? ` href="${PLAY_URL(gid)}"` : '';
    return `<${tag}${href} class="${cls}"><span class="link-dot" aria-hidden="true"></span>${g.name}</${tag}>`;
  }

  const sectionsHtml = SIDEBAR_CATS.map(cat => {
    const gamesHtml = cat.games.map(buildSidebarLink).join('');
    return `
      <div class="sidebar-section open" data-section="${cat.sectionId}">
        <div class="sidebar-cat" role="button" tabindex="0" aria-expanded="true">
          <span class="cat-icon" aria-hidden="true">${cat.icon}</span>
          <span class="cat-label">${cat.label}</span>
          ${SVG_CHEVRON}
        </div>
        <div class="sidebar-games">${gamesHtml}</div>
      </div>`;
  }).join('<div class="sidebar-divider" aria-hidden="true"></div>');

  const allGamesHtml = Object.keys(GAMES).map(buildSidebarLink).join('');

  nav.innerHTML = sectionsHtml +
    '<div class="sidebar-divider" aria-hidden="true"></div>' +
    `<div class="sidebar-cat" style="pointer-events:none; cursor:default;">
       <span class="cat-label" style="font-size:0.68rem; letter-spacing:0.8px;">ALL GAMES</span>
     </div>` +
    allGamesHtml;

  /* ── SIDEBAR COLLAPSE ── */
  nav.addEventListener('click', e => {
    const catEl = e.target.closest('.sidebar-cat');
    if (!catEl) return;
    const sec = catEl.closest('.sidebar-section');
    const isOpen = sec.classList.toggle('open');
    catEl.setAttribute('aria-expanded', isOpen);

    // scroll main to section
    const sectionId = sec.dataset.section;
    if (sectionId) {
      const target = document.getElementById(sectionId);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // close sidebar on mobile after navigation
    if (window.innerWidth < 769 && isOpen) {
      closeSidebar();
    }
  });

  nav.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      const catEl = e.target.closest('.sidebar-cat');
      if (catEl) { e.preventDefault(); catEl.click(); }
    }
  });

  /* ── HAMBURGER / SIDEBAR TOGGLE ── */
  const hamBtn = document.getElementById('ham-btn');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');

  function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('open');
    hamBtn.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
    hamBtn.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }

  hamBtn.addEventListener('click', () => {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  overlay.addEventListener('click', closeSidebar);

  /* ── SEARCH ── */
  const searchInput   = document.getElementById('search-input');
  const sectionsDiv   = document.getElementById('sections-container');
  const searchPanel   = document.getElementById('search-panel');
  const searchGrid    = document.getElementById('search-results-grid');
  const noResults     = document.getElementById('no-results');
  const queryLabel    = document.getElementById('search-query-label');

  const ALL_GAME_IDS  = Object.keys(GAMES);

  function runSearch(q) {
    q = q.trim().toLowerCase();
    if (!q) {
      searchPanel.classList.remove('active');
      sectionsDiv.style.display = '';
      return;
    }

    searchPanel.classList.add('active');
    sectionsDiv.style.display = 'none';
    queryLabel.textContent = q;

    const matches = ALL_GAME_IDS.filter(id => {
      const g = GAMES[id];
      return g.name.toLowerCase().includes(q) || g.cat.toLowerCase().includes(q);
    });

    if (matches.length === 0) {
      searchGrid.innerHTML = '';
      noResults.hidden = false;
    } else {
      searchGrid.innerHTML = matches.map(buildCard).join('');
      noResults.hidden = true;
    }
  }

  searchInput.addEventListener('input', () => runSearch(searchInput.value));
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      searchInput.value = '';
      runSearch('');
      searchInput.blur();
    }
  });

})();
</script>

</body>
</html>
