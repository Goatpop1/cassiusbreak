<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CassiusBreak — Free Unblocked Games You Can Play at School</title>
  <meta name="description" content="Play free unblocked games instantly — no downloads, no sign-up. CassiusBreak Originals: Dino Run, Block Drop and Slope. Works on any school network or device.">
  <meta name="keywords" content="unblocked games, free games, school games, dino run, block drop, slope, games at school">
  <meta name="theme-color" content="#0F0F0F">
  <meta property="og:title" content="CassiusBreak — Free Unblocked Games">
  <meta property="og:description" content="Free unblocked games that work at school. No downloads, no sign-up.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cassiusbreak.com">
  <link rel="canonical" href="https://cassiusbreak.com">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230F0F0F'/><text x='50' y='72' font-size='64' font-family='Arial' font-weight='900' text-anchor='middle' fill='%2300A8FF'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:      #00A8FF;
      --accent-dim:  rgba(0,168,255,0.12);
      --accent-glow: rgba(0,168,255,0.25);
      --bg:          #0F0F0F;
      --bg2:         #161616;
      --bg3:         #1C1C1C;
      --bg4:         #242424;
      --border:      rgba(255,255,255,0.07);
      --border2:     rgba(255,255,255,0.11);
      --text:        #F0F0F0;
      --text2:       #999;
      --text3:       #555;
      --topbar-h:    58px;
      --sidebar-w:   244px;
      --r:           10px;
    }

    html { scroll-behavior: smooth; overflow-x: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }

    /* ── TOPBAR ──────────────────────────────── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: rgba(15,15,15,0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      z-index: 300;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 14px;
    }

    .ham-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      padding: 7px;
      border-radius: 7px;
      flex-shrink: 0;
      transition: color .15s, background .15s;
    }
    .ham-btn:hover { color: var(--text); background: var(--bg3); }
    .ham-btn svg { display: block; width: 20px; height: 20px; }

    .logo {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .logo-cassius { color: var(--text); }
    .logo-break   { color: var(--accent); }

    .topbar-spacer { flex: 1; }

    .topbar-search {
      width: 340px;
      flex-shrink: 0;
      position: relative;
    }
    .topbar-search svg {
      position: absolute;
      left: 11px;
      top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px;
      color: var(--text3);
      pointer-events: none;
    }
    .topbar-search input {
      width: 100%;
      height: 36px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.86rem;
      padding: 0 12px 0 34px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .topbar-search input::placeholder { color: var(--text3); }
    .topbar-search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    /* ── LAYOUT ─────────────────────────────── */
    .layout {
      display: flex;
      padding-top: var(--topbar-h);
      min-height: 100vh;
    }

    /* ── SIDEBAR ─────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: fixed;
      top: var(--topbar-h);
      left: 0;
      bottom: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      padding: 12px 0 40px;
      scrollbar-width: thin;
      scrollbar-color: var(--bg4) transparent;
      z-index: 200;
      transition: transform .24s cubic-bezier(.4,0,.2,1);
    }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

    .sidebar-section { margin-bottom: 2px; }

    .sidebar-cat {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 14px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text2);
      cursor: pointer;
      user-select: none;
      transition: color .14s, background .14s;
      border-radius: 0;
    }
    .sidebar-cat:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .sidebar-cat.active-section { color: var(--accent); }

    .sidebar-cat .cat-icon { font-size: 0.85rem; line-height: 1; }
    .sidebar-cat .cat-label { flex: 1; }

    .chevron {
      width: 13px; height: 13px;
      flex-shrink: 0;
      color: var(--text3);
      transition: transform .2s;
    }
    .sidebar-section.open .chevron { transform: rotate(90deg); }

    .sidebar-games {
      overflow: hidden;
      max-height: 0;
      transition: max-height .25s ease;
    }
    .sidebar-section.open .sidebar-games { max-height: 500px; }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 14px 6px 26px;
      font-size: 0.82rem;
      color: var(--text2);
      transition: color .14s, background .14s;
    }
    .sidebar-link:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .sidebar-link.is-original { color: var(--accent); }
    .sidebar-link.is-original:hover { color: #33bbff; }
    .sidebar-link.is-soon { opacity: 0.45; pointer-events: none; }

    .link-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--text3);
      flex-shrink: 0;
    }
    .sidebar-link.is-original .link-dot { background: var(--accent); }

    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 14px;
    }

    /* ── SIDEBAR OVERLAY (mobile) ─────────────── */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 199;
      opacity: 0;
      transition: opacity .24s;
    }
    .sidebar-overlay.open { opacity: 1; }

    /* ── MAIN ────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-width: 0;
      padding: 24px 26px 64px;
    }

    /* ── AD SLOT ─────────────────────────────── */
    .ad-slot {
      width: 100%;
      max-width: 728px;
      height: 90px;
      background: var(--bg2);
      border: 1px dashed var(--border2);
      border-radius: var(--r);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text3);
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* ── SECTION ROW ─────────────────────────── */
    .game-section {
      margin-bottom: 32px;
      scroll-margin-top: calc(var(--topbar-h) + 16px);
    }

    .sec-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .sec-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sec-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .sec-star {
      font-size: 0.8rem;
      color: var(--accent);
    }
    .sec-count {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text3);
    }

    /* ── CARDS GRID ──────────────────────────── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
      gap: 13px;
    }

    /* ── GAME CARD ───────────────────────────── */
    .game-card {
      border-radius: var(--r);
      overflow: hidden;
      background: var(--bg3);
      border: 1px solid var(--border);
      display: block;
      position: relative;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    a.game-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0,168,255,0.35);
      box-shadow: 0 8px 22px rgba(0,168,255,0.14), 0 2px 8px rgba(0,0,0,0.45);
    }

    .card-thumb {
      position: relative;
      aspect-ratio: 16/10;
      overflow: hidden;
    }
    .card-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .34s ease;
    }
    a.game-card:hover .card-thumb img { transform: scale(1.06); }

    /* Placeholder thumb backgrounds */
    .ph-action  { background: linear-gradient(135deg, #1a0c0c, #260e0e); }
    .ph-puzzle  { background: linear-gradient(135deg, #0d0d1c, #131328); }
    .ph-racing  { background: linear-gradient(135deg, #0a1600, #0e1e00); }
    .ph-shooter { background: linear-gradient(135deg, #1a0e00, #221400); }
    .ph-sports  { background: linear-gradient(135deg, #001a0e, #002016); }
    .ph-arcade  { background: linear-gradient(135deg, #1a1400, #201a00); }
    .ph-skill   { background: linear-gradient(135deg, #001418, #001c22); }
    .ph-io      { background: linear-gradient(135deg, #140014, #1e001e); }

    .ph-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .ph-icon {
      font-size: 1.6rem;
      opacity: 0.18;
      line-height: 1;
    }
    .ph-label {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text3);
    }

    /* Play overlay */
    .play-ov {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.48);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .18s;
    }
    a.game-card:hover .play-ov { opacity: 1; }
    .play-circle {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,168,255,0.55);
      transform: scale(0.78);
      transition: transform .18s;
    }
    a.game-card:hover .play-circle { transform: scale(1); }
    .play-circle svg { width: 16px; height: 16px; color: #fff; margin-left: 2px; }

    /* Badges */
    .badge-orig {
      position: absolute;
      top: 7px; left: 7px;
      z-index: 2;
      background: var(--accent);
      color: #fff;
      font-size: 0.56rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 4px;
    }
    .badge-soon {
      position: absolute;
      top: 7px; right: 7px;
      z-index: 2;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border2);
      color: var(--text2);
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 4px;
    }
    .badge-hot {
      position: absolute;
      top: 7px; right: 7px;
      z-index: 2;
      background: rgba(255,80,50,0.2);
      border: 1px solid rgba(255,80,50,0.4);
      color: #ff6644;
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 4px;
    }

    /* Card info */
    .card-info {
      padding: 8px 10px 10px;
    }
    .card-name {
      font-size: 0.84rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-cat {
      font-size: 0.7rem;
      color: var(--text3);
      margin-top: 2px;
    }
    .game-card.is-soon .card-name { color: var(--text2); }

    /* ── SEARCH RESULTS ──────────────────────── */
    .search-panel { display: none; }
    .search-panel.active { display: block; }
    .search-panel .sec-head { margin-bottom: 14px; }
    #search-query-label { color: var(--accent); }

    .no-results {
      padding: 48px 0;
      text-align: center;
      color: var(--text2);
      font-size: 0.95rem;
    }

    /* ── FOOTER ──────────────────────────────── */
    footer {
      margin-left: var(--sidebar-w);
      border-top: 1px solid var(--border);
      padding: 22px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text3);
      font-size: 0.78rem;
      flex-wrap: wrap;
      gap: 10px;
    }
    footer a { color: var(--text2); transition: color .14s; }
    footer a:hover { color: var(--accent); }
    .footer-links { display: flex; gap: 20px; }

    /* ── RESPONSIVE ──────────────────────────── */
    @media (max-width: 960px) {
      .cards-grid { grid-template-columns: repeat(auto-fill, minmax(144px, 1fr)); }
    }

    @media (max-width: 768px) {
      .ham-btn { display: flex; align-items: center; justify-content: center; }

      .sidebar {
        transform: translateX(calc(-1 * var(--sidebar-w)));
        box-shadow: none;
        z-index: 250;
      }
      .sidebar.open {
        transform: translateX(0);
        box-shadow: 6px 0 24px rgba(0,0,0,0.55);
      }
      .sidebar-overlay { display: block; pointer-events: none; }
      .sidebar-overlay.open { pointer-events: auto; }

      .main { margin-left: 0; padding: 18px 14px 56px; }
      footer { margin-left: 0; padding: 18px 14px; }

      .topbar-search { width: auto; flex: 1; }
      .topbar-spacer { display: none; }
    }

    @media (max-width: 520px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
      .logo { font-size: 1.1rem; }
      .ad-slot { height: 60px; font-size: 0.58rem; }
    }

    @media (max-width: 340px) {
      .cards-grid { grid-template-columns: 1fr; }
    }

    /* reduce motion */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .game-card, .play-circle, .card-thumb img, .sidebar, .chevron { transition: none; }
    }
  </style>
</head>

      title: 'Puzzle',
      dot: true,
      games: ['block-drop', 'cube-maze', 'bubble-pop', 'flip-it', 'neon-pong']
    },
    {
      id: 'racing',
      title: 'Racing',
      dot: true,
      games: ['drift-kings', 'hyper-kart', 'speed-trials', 'goal-rush']
    },
    {
      id: 'shooters',
      title: 'Shooters',
      dot: true,
      games: ['pixel-strike', 'rush-blast', 'space-chain', 'combat-zone']
    },
    {
      id: 'sports',
      title: 'Sports',
      dot: true,
      games: ['goal-rush', 'basket-jam', 'pool-rush', 'neon-pong']
    },
    {
      id: 'io-games',
      title: '.io Games',
      dot: true,
      games: ['snake-arena', 'io-swarm', 'io-merge', 'combat-zone']
    },
  ];

  /* ── SIDEBAR CATEGORIES ── */
  const SIDEBAR_CATS = [
    { icon: '⭐', label: 'Originals',  sectionId: 'originals', startOpen: true,
      games: ['speed-runner', 'block-drop', 'slope'] },
    { icon: '⚔️', label: 'Action',     sectionId: 'action',
      games: ['combat-zone', 'ninja-dash', 'mech-assault'] },
    { icon: '🧩', label: 'Puzzle',     sectionId: 'puzzle',
      games: ['block-drop', 'cube-maze', 'bubble-pop'] },
    { icon: '🏎', label: 'Racing',     sectionId: 'racing',
      games: ['drift-kings', 'hyper-kart', 'speed-trials'] },
    { icon: '🔫', label: 'Shooters',   sectionId: 'shooters',
      games: ['pixel-strike', 'rush-blast', 'space-chain'] },
    { icon: '⚽', label: 'Sports',     sectionId: 'sports',
      games: ['goal-rush', 'basket-jam', 'pool-rush'] },
    { icon: '🕹', label: 'Arcade',     sectionId: 'trending',
      games: ['speed-runner', 'snake-arena', 'neon-pong'] },
    { icon: '🌐', label: '.io Games',  sectionId: 'io-games',
      games: ['snake-arena', 'io-swarm', 'io-merge'] },
  ];

  const PLAY_URL = id => '/game.html?game=' + id;

  /* ── ICON SVGs ── */
  const SVG_PLAY = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg>`;
  const SVG_CHEVRON = `<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>`;

  /* ── BUILD CARD HTML ── */
  function buildCard(gameId) {
    const g = GAMES[gameId];
    if (!g) return '';

    const isSoon = g.soon;
    const isOrig = g.original;
    const isOrigPlaceholder = g.orig_placeholder;

    let thumbHtml;
    if (g.playable && g.img) {
      thumbHtml = `
        <div class="card-thumb">
          <img src="${g.img}" alt="${g.name} — free unblocked ${g.cat} game" loading="lazy" width="320" height="200">
          ${isOrig ? `<span class="badge-orig">Original</span>` : ''}
          <div class="play-ov"><div class="play-circle">${SVG_PLAY}</div></div>
        </div>`;
    } else if (isOrigPlaceholder) {
      thumbHtml = `
        <div class="card-thumb ${g.ph || 'ph-skill'}">
          <div class="ph-inner"><div class="ph-icon">${g.icon}</div><div class="ph-label">Original</div></div>
          <span class="badge-orig">Original</span>
          <span class="badge-soon">Soon</span>
        </div>`;
    } else {
      thumbHtml = `
        <div class="card-thumb ${g.ph}">
          <div class="ph-inner"><div class="ph-icon">${g.icon}</div><div class="ph-label">${g.cat}</div></div>
          <span class="badge-soon">Soon</span>
        </div>`;
    }

    const info = `
      <div class="card-info">
        <div class="card-name">${g.name}</div>
        <div class="card-cat">${g.cat}</div>
      </div>`;

    if (isSoon) {
      return `<div class="game-card is-soon" role="article" aria-label="${g.name} — coming soon">${thumbHtml}${info}</div>`;
    }
    return `<a class="game-card" href="${PLAY_URL(gameId)}" aria-label="Play ${g.name}">${thumbHtml}${info}</a>`;
  }

  /* ── RENDER SECTIONS ── */
  const container = document.getElementById('sections-container');
  container.innerHTML = SECTIONS.map(sec => {
    const titleIcon = sec.star
      ? `<span class="sec-star">★</span> ${sec.title}`
      : sec.dot
        ? `<span class="sec-dot" aria-hidden="true"></span>${sec.title}`
        : sec.title;

    return `
      <section class="game-section" id="${sec.id}" aria-labelledby="sec-${sec.id}">
        <div class="sec-head">
          <h2 class="sec-title" id="sec-${sec.id}">${titleIcon}</h2>
          <span class="sec-count">${sec.games.length} games</span>
        </div>
        <div class="cards-grid">
          ${sec.games.map(buildCard).join('')}
        </div>
      </section>`;
  }).join('');

  /* ── RENDER SIDEBAR ── */
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = SIDEBAR_CATS.map((cat, i) => {
    const gamesHtml = cat.games.map(gid => {
      const g = GAMES[gid];
      if (!g) return '';
      const isOrig = g.original;
      const isSoon = g.soon;
      const cls = isOrig ? 'sidebar-link is-original' : isSoon ? 'sidebar-link is-soon' : 'sidebar-link';
      const href = g.playable ? `href="${PLAY_URL(gid)}"` : '';
      const tag = g.playable ? 'a' : 'span';
      return `<${tag} ${href} class="${cls}"><span class="link-dot" aria-hidden="true"></span>${g.name}</${tag}>`;
    }).join('');

    const openClass = cat.startOpen ? ' open' : '';
    return `
      <div class="sidebar-section${openClass}" data-section="${cat.sectionId}">
        <div class="sidebar-cat" role="button" tabindex="0" aria-expanded="${cat.startOpen ? 'true' : 'false'}">
          <span class="cat-icon" aria-hidden="true">${cat.icon}</span>
          <span class="cat-label">${cat.label}</span>
          ${SVG_CHEVRON}
        </div>
        <div class="sidebar-games">${gamesHtml}</div>
      </div>`;
  }).join('<div class="sidebar-divider" aria-hidden="true"></div>');

  /* ── SIDEBAR COLLAPSE ── */
  nav.addEventListener('click', e => {
    const catEl = e.target.closest('.sidebar-cat');
    if (!catEl) return;
    const sec = catEl.closest('.sidebar-section');
    const isOpen = sec.classList.toggle('open');
    catEl.setAttribute('aria-expanded', isOpen);

    // scroll main to section
    const sectionId = sec.dataset.section;
    if (sectionId) {
      const target = document.getElementById(sectionId);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // close sidebar on mobile after navigation
    if (window.innerWidth < 769 && isOpen) {
      closeSidebar();
    }
  });

  nav.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      const catEl = e.target.closest('.sidebar-cat');
      if (catEl) { e.preventDefault(); catEl.click(); }
    }
  });

  /* ── HAMBURGER / SIDEBAR TOGGLE ── */
  const hamBtn = document.getElementById('ham-btn');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');

  function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('open');
    hamBtn.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
    hamBtn.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }

  hamBtn.addEventListener('click', () => {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  overlay.addEventListener('click', closeSidebar);

  /* ── SEARCH ── */
  const searchInput   = document.getElementById('search-input');
  const sectionsDiv   = document.getElementById('sections-container');
  const searchPanel   = document.getElementById('search-panel');
  const searchGrid    = document.getElementById('search-results-grid');
  const noResults     = document.getElementById('no-results');
  const queryLabel    = document.getElementById('search-query-label');

  const ALL_GAME_IDS  = Object.keys(GAMES);

  function runSearch(q) {
    q = q.trim().toLowerCase();
    if (!q) {
      searchPanel.classList.remove('active');
      sectionsDiv.style.display = '';
      return;
    }

    searchPanel.classList.add('active');
    sectionsDiv.style.display = 'none';
    queryLabel.textContent = q;

    const matches = ALL_GAME_IDS.filter(id => {
      const g = GAMES[id];
      return g.name.toLowerCase().includes(q) || g.cat.toLowerCase().includes(q);
    });

    if (matches.length === 0) {
      searchGrid.innerHTML = '';
      noResults.hidden = false;
    } else {
      searchGrid.innerHTML = matches.map(buildCard).join('');
      noResults.hidden = true;
    }
  }

  searchInput.addEventListener('input', () => runSearch(searchInput.value));
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      searchInput.value = '';
      runSearch('');
      searchInput.blur();
    }
  });

})();
</script>

</body>
</html>
