<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CassiusBreak - Free Online Games</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #1a0033;
      --bg-dark: #0d001a;
      --accent: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.4);
      --text: #ffffff;
      --text-muted: #aaaacc;
      --sidebar-width: 250px;
      --header-height: 64px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: var(--bg-dark);
      border-bottom: 2px solid var(--accent);
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 100;
      box-shadow: 0 2px 20px var(--accent-glow);
    }

    .logo {
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 2px;
      text-shadow: 0 0 16px var(--accent), 0 0 32px rgba(0, 255, 136, 0.3);
      text-transform: uppercase;
    }

    .logo span {
      color: #ffffff;
    }

    /* ── LAYOUT ──────────────────────────────────────────── */
    .layout {
      display: flex;
      padding-top: var(--header-height);
      min-height: 100vh;
    }

    /* ── SIDEBAR ─────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--bg-dark);
      border-right: 1px solid rgba(0, 255, 136, 0.2);
      position: fixed;
      top: var(--header-height);
      bottom: 0;
      left: 0;
      overflow-y: auto;
      padding: 28px 0;
    }

    .sidebar-title {
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 0 20px 16px;
      border-bottom: 1px solid rgba(0, 255, 136, 0.15);
      margin-bottom: 8px;
    }

    .sidebar nav a {
      display: block;
      padding: 12px 20px;
      color: #ff8c00;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      transition: color 0.2s, background 0.2s, padding-left 0.2s;
      border-left: 3px solid transparent;
    }

    .sidebar nav a:hover {
      color: var(--accent);
      background: rgba(0, 255, 136, 0.06);
      padding-left: 26px;
      border-left-color: var(--accent);
      text-shadow: 0 0 8px var(--accent-glow);
    }

    /* ── MAIN CONTENT ────────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 32px 28px 60px;
      max-width: 1200px;
    }

    /* ── SEARCH ──────────────────────────────────────────── */
    .search-wrap {
      margin-bottom: 36px;
      position: relative;
    }

    .search-wrap::before {
      content: '⌕';
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.2rem;
      pointer-events: none;
    }

    #search {
      width: 100%;
      max-width: 500px;
      padding: 14px 18px 14px 44px;
      background: var(--bg-dark);
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #search::placeholder {
      color: var(--text-muted);
    }

    #search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* ── SECTION HEADING ─────────────────────────────────── */
    .section-heading {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
    }

    /* ── GAMES GRID ──────────────────────────────────────── */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    /* ── GAME CARD ───────────────────────────────────────── */
    .card {
      background: var(--bg-dark);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 136, 0.15);
      transition: transform 0.22s, box-shadow 0.22s, border-color 0.22s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 32px var(--accent-glow), 0 0 0 1px var(--accent);
      border-color: var(--accent);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      display: block;
    }

    .card-body {
      padding: 14px 16px 16px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-btn {
      display: inline-block;
      padding: 6px 18px;
      background: transparent;
      border: 1.5px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
    }

    .play-btn:hover {
      background: var(--accent);
      color: var(--bg-dark);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* ── NO RESULTS ──────────────────────────────────────── */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 60px 0;
      font-size: 1rem;
      display: none;
    }

    /* ── FOOTER ──────────────────────────────────────────── */
    footer {
      background: var(--bg-dark);
      border-top: 1px solid rgba(0, 255, 136, 0.15);
      text-align: center;
      padding: 22px;
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-left: var(--sidebar-width);
    }

    /* ── RESPONSIVE ──────────────────────────────────────── */
    @media (max-width: 1100px) {
      .games-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .main {
        margin-left: 0;
        padding: 24px 16px 48px;
      }

      footer {
        margin-left: 0;
      }

      .games-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 440px) {
      .games-grid {
        grid-template-columns: 1fr;
      }

      .logo {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">Cassius<span>Break</span></div>
  </header>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-title">Games</div>
      <nav>
        <a href="/game.html?game=speed-runner">Dino Run</a>
        <a href="/game.html?game=block-drop">Block Drop</a>
        <a href="/game.html?game=slope">Slope</a>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="search-wrap">
        <input
          id="search"
          type="text"
          placeholder="Search games…"
          aria-label="Search games"
          autocomplete="off"
        >
      </div>

      <div class="section-heading">All Games</div>

      <div class="games-grid" id="games-grid">

        <!-- Dino Run -->
        <div class="card" data-name="dino run">
          <img class="card-thumb" src="images/dino-run.png" alt="Dino Run" style="object-fit:cover;">
          <div class="card-body">
            <div class="card-title">Dino Run</div>
            <a class="play-btn" href="/game.html?game=speed-runner">Play</a>
          </div>
        </div>

        <!-- Block Drop -->
        <div class="card" data-name="block drop">
          <img class="card-thumb" src="images/block-drop.png" alt="Block Drop" style="object-fit:cover;">
          <div class="card-body">
            <div class="card-title">Block Drop</div>
            <a class="play-btn" href="/game.html?game=block-drop">Play</a>
          </div>
        </div>

        <!-- Slope -->
        <div class="card" data-name="slope">
          <img class="card-thumb" src="images/slope.png" alt="Slope" style="object-fit:cover;">
          <div class="card-body">
            <div class="card-title">Slope</div>
            <a class="play-btn" href="/game.html?game=slope">Play</a>
          </div>
        </div>

<div class="no-results" id="no-results">No games found.</div>

      </div>
    </main>
  </div>

  <!-- FOOTER -->
  <footer>
    &copy; CassiusBreak 2026 &mdash; All games are original
  </footer>

  <script>
    const search = document.getElementById('search');
    const cards = document.querySelectorAll('.card[data-name]');
    const noResults = document.getElementById('no-results');

    search.addEventListener('input', () => {
      const q = search.value.toLowerCase().trim();
      let visible = 0;
      cards.forEach(card => {
        const match = card.dataset.name.includes(q);
        card.style.display = match ? '' : 'none';
        if (match) visible++;
      });
      noResults.style.display = visible === 0 ? 'block' : 'none';
    });
  </script>

</body>
</html>
