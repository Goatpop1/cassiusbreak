<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CassiusBreak</title>
  <meta name="theme-color" content="#0a0a12">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a0a12'/><text x='50' y='72' font-size='64' font-family='Arial' font-weight='900' text-anchor='middle' fill='%2338bdf8'>C</text></svg>">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a12;
      --bg-dark: #0f0f1c;
      --bg-card: #141426;
      --accent: #38bdf8;
      --accent-2: #8b5cf6;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --grad: linear-gradient(105deg, #22d3ee 0%, #38bdf8 38%, #8b5cf6 100%);
      --line: rgba(255,255,255,0.08);
      --line-2: rgba(255,255,255,0.14);
      --text: #f5f7ff;
      --text-muted: #9aa0bf;
      --header-height: 64px;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(800px 500px at 10% -10%, rgba(56,189,248,0.12), transparent 60%),
        radial-gradient(700px 500px at 95% 6%, rgba(139,92,246,0.12), transparent 58%);
      pointer-events: none;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: rgba(10,10,18,0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 20px;
      z-index: 200;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: color 0.2s;
      white-space: nowrap;
    }

    .back-btn:hover {
      color: var(--accent);
    }

    .back-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .header-divider {
      width: 1px;
      height: 28px;
      background: rgba(56, 189, 248, 0.2);
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .logo .mark {
      width: 30px; height: 30px;
      border-radius: 9px;
      background: var(--grad);
      display: grid;
      place-items: center;
      font-size: 1rem;
      color: #06121e;
      box-shadow: 0 4px 14px rgba(56,189,248,0.45);
    }

    .logo b {
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .logo span { color: var(--text); }

    .header-game-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-left: auto;
      letter-spacing: 1px;
    }

    /* ── MAIN CONTENT ────────────────────────────────────── */
    .page {
      padding-top: var(--header-height);
    }

    /* ── GAME SECTION ────────────────────────────────────── */
    .game-section {
      background: #000;
      border-bottom: 2px solid rgba(56, 189, 248, 0.25);
      position: relative;
    }

    /* Stage = top ad bar + (side ad | game | side ad), fitted to the viewport */
    .game-stage {
      height: calc(100vh - var(--header-height));
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }

    .game-row {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    /* Advertising placeholders around the game */
    .ad-rail {
      background: var(--bg-card);
      border: 1px dashed rgba(56, 189, 248, 0.25);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      flex-shrink: 0;
      user-select: none;
    }

    .ad-top {
      width: 100%;
      max-width: 728px;
      height: 90px;           /* Google leaderboard: 728×90 */
      margin: 0 auto;
    }

    .ad-side {
      width: 300px;           /* Google medium rectangle / half-page: 300px wide */
      min-height: 250px;      /* shortest standard unit: 300×250 */
      align-self: stretch;
    }

    .game-wrapper {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: stretch;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      touch-action: none;
    }

    /* Fullscreen button overlay */
    .fullscreen-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 8px;
      color: var(--accent);
      padding: 8px 14px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s;
      z-index: 10;
      user-select: none;
    }

    .fullscreen-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
    }

    .fullscreen-btn svg {
      width: 14px;
      height: 14px;
    }

    /* scroll hint arrow */
    .scroll-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: rgba(255,255,255,0.35);
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: bob 2s ease-in-out infinite;
      pointer-events: none;
      user-select: none;
    }

    .scroll-hint svg {
      width: 20px;
      height: 20px;
    }

    @keyframes bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(6px); }
    }

    /* ── INFO SECTION ────────────────────────────────────── */
    .info-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 56px 32px 80px;
    }

    .info-title {
      font-size: 2rem;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .info-tagline {
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    .info-card {
      background: var(--bg-card);
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 14px;
      padding: 28px;
    }

    .info-card.full-width {
      grid-column: 1 / -1;
    }

    .info-card-heading {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .info-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.75;
    }

    /* Controls table */
    .controls-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .controls-list li {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 32px;
      padding: 0 10px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 6px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* More games strip */
    .more-games {
      margin-top: 56px;
      padding-top: 48px;
      border-top: 1px solid rgba(56, 189, 248, 0.12);
    }

    .more-games-heading {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 24px;
    }

    .more-games-grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .more-card {
      background: var(--bg-card);
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px 14px 14px;
      min-width: 180px;
    }

    .more-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 24px var(--accent-glow);
      border-color: var(--accent);
    }

    .more-card-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }

    .more-card-cta {
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ── RESPONSIVE ──────────────────────────────────────── */
    /* Drop side rails when viewport is too narrow (< 300+game+300 + gaps/padding) */
    @media (max-width: 1100px) {
      .ad-side { display: none; }
    }

    @media (max-width: 640px) {
      .game-stage {
        height: auto;
        gap: 8px;
        padding: 8px;
      }

      .ad-top { height: 60px; }

      .game-row {
        height: 60vh;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .info-section {
        padding: 36px 20px 60px;
      }

      .info-title {
        font-size: 1.5rem;
      }

      .header-game-title {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a class="back-btn" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      All Games
    </a>
    <div class="header-divider"></div>
    <a class="logo" href="/"><span class="mark">C</span><span>Cassius<b>Break</b></span></a>
    <div class="header-game-title" id="header-game-title"></div>
  </header>

  <div class="page">

    <!-- GAME BOX -->
    <div class="game-section">
      <div class="game-stage">

        <!-- Top advertisement -->
        <div class="ad-rail ad-top" aria-label="Advertisement space">Advertisement</div>

        <div class="game-row">
          <!-- Left advertisement -->
          <div class="ad-rail ad-side ad-left" aria-label="Advertisement space">Advertisement</div>

          <div class="game-wrapper">
            <iframe id="game-frame" allowfullscreen scrolling="no" title="Game"></iframe>

            <button class="fullscreen-btn" id="fullscreen-btn" title="Fullscreen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
                <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
              </svg>
              Fullscreen
            </button>

            <div class="scroll-hint" id="scroll-hint">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
              Scroll for info
            </div>
          </div>

          <!-- Right advertisement -->
          <div class="ad-rail ad-side ad-right" aria-label="Advertisement space">Advertisement</div>
        </div>

      </div>
    </div>

    <!-- INFO BELOW GAME -->
    <div class="info-section">
      <div class="info-title" id="info-title">Game</div>
      <div class="info-tagline" id="info-tagline"></div>

      <div class="info-grid">
        <div class="info-card full-width">
          <div class="info-card-heading">About</div>
          <p id="info-description"></p>
        </div>

        <div class="info-card">
          <div class="info-card-heading">Controls</div>
          <ul class="controls-list" id="controls-list"></ul>
        </div>

        <div class="info-card">
          <div class="info-card-heading">Tips</div>
          <p id="info-tips"></p>
        </div>
      </div>

      <div class="more-games">
        <div class="more-games-heading">More Games</div>
        <div class="more-games-grid" id="more-games-grid"></div>
      </div>
    </div>

  </div>

  <script>
    const GAMES = {
      'speed-runner': {
        name: 'Dino Run',
        tagline: 'Endless Runner',
        src: '/games/speed-runner/index.html',
        description: 'Dodge incoming obstacles in this fast-paced endless runner. The further you go, the faster it gets — how long can you survive?',
        tips: 'Time your jumps early — obstacles come fast at higher speeds. Focus on rhythm rather than reacting at the last second.',
        controls: [
          { key: 'Space', action: 'Jump' },
          { key: '↑', action: 'Jump' },
          { key: 'Tap', action: 'Jump (mobile)' },
        ],
      },
      'block-drop': {
        name: 'Block Drop',
        tagline: 'Puzzle',
        src: '/games/block-drop/index.html',
        description: 'Stack and clear blocks in this classic puzzle game. Fill complete rows to clear them and keep the board from filling up.',
        tips: 'Keep the stack flat and low. Build toward the edges first so you can fill rows faster.',
        controls: [
          { key: '←  →', action: 'Move block' },
          { key: '↑', action: 'Rotate' },
          { key: '↓', action: 'Soft drop' },
          { key: 'Space', action: 'Hard drop' },
        ],
      },
      'slope': {
        name: 'Slope',
        tagline: 'Reflex & Speed',
        src: '/games/Slope/index.html',
        description: 'Roll a ball down an endless, procedurally generated slope. Dodge the red barriers and don\'t fall off the edge.',
        tips: 'Stay near the centre of the track when possible — edges give you less room to react. Steer smoothly rather than tapping.',
        controls: [
          { key: '←  →', action: 'Steer ball' },
          { key: 'A  D', action: 'Steer ball' },
          { key: 'Space', action: 'Restart after game over' },
        ],
      },
      '2048': {
        name: '2048',
        tagline: 'Puzzle',
        src: '/games/2048/index.html',
        description: 'Slide the numbered tiles and merge matching pairs to add them up. Combine tiles again and again to reach the elusive 2048 tile — and keep going for an even higher score.',
        tips: 'Pick one corner and keep your biggest tile parked there. Build a sorted row toward that corner and avoid swiping in the direction that would move it away.',
        controls: [
          { key: '←  →', action: 'Slide tiles' },
          { key: '↑  ↓', action: 'Slide tiles' },
          { key: 'Swipe', action: 'Slide tiles (mobile)' },
        ],
      },
      'snake': {
        name: 'Snake',
        tagline: 'Arcade Classic',
        src: '/games/snake/index.html',
        description: 'Guide the snake around the board to eat the food and grow longer. Every bite makes you bigger — but run into a wall or your own tail and it is game over.',
        tips: 'Leave yourself an exit. As you get longer, move in wide loops around the edges instead of cutting through the middle where you can trap yourself.',
        controls: [
          { key: '←  →', action: 'Turn' },
          { key: '↑  ↓', action: 'Turn' },
          { key: 'W A S D', action: 'Turn' },
        ],
      },
      'flappy-bird': {
        name: 'Flappy Bird',
        tagline: 'Endless Flyer',
        src: '/games/flappy-bird/index.html',
        description: 'Flap your way through an endless series of pipes. Tap to give the bird a quick lift and try to slip through each gap without touching anything.',
        tips: 'Use small, steady taps rather than mashing — gentle flaps keep your height under control. Aim for the centre of each gap and look ahead to the next pipe.',
        controls: [
          { key: 'Space', action: 'Flap' },
          { key: 'Click', action: 'Flap' },
          { key: 'Tap', action: 'Flap (mobile)' },
        ],
      },
      'minesweeper': {
        name: 'Minesweeper',
        tagline: 'Logic Puzzle',
        src: '/games/minesweeper/index.html',
        description: 'Clear the board without detonating a mine. Each revealed number tells you how many mines touch that square — use logic to deduce where the mines are hiding.',
        tips: 'Start in the open middle of the board. Flag squares you are sure are mines, and look for numbers already satisfied by their flags so you can safely open the rest.',
        controls: [
          { key: 'Click', action: 'Reveal square' },
          { key: 'R-Click', action: 'Place flag' },
          { key: 'Mouse', action: 'Pick difficulty' },
        ],
      },
    };

    const ALL_GAMES = [
      { id: 'speed-runner', name: 'Dino Run' },
      { id: 'block-drop', name: 'Block Drop' },
      { id: 'slope', name: 'Slope' },
      { id: '2048', name: '2048' },
      { id: 'snake', name: 'Snake' },
      { id: 'flappy-bird', name: 'Flappy Bird' },
      { id: 'minesweeper', name: 'Minesweeper' },
    ];

    // Parse ?game= from URL
    const params = new URLSearchParams(location.search);
    const gameId = params.get('game') || 'speed-runner';
    const game = GAMES[gameId] || GAMES['speed-runner'];

    // Set page title
    document.title = game.name + ' — CassiusBreak';

    // Populate header
    document.getElementById('header-game-title').textContent = game.name;

    // Load game iframe
    document.getElementById('game-frame').src = game.src;

    // Populate info
    document.getElementById('info-title').textContent = game.name;
    document.getElementById('info-tagline').textContent = game.tagline;
    document.getElementById('info-description').textContent = game.description;
    document.getElementById('info-tips').textContent = game.tips;

    const controlsList = document.getElementById('controls-list');
    game.controls.forEach(({ key, action }) => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="key">${key}</span><span>${action}</span>`;
      controlsList.appendChild(li);
    });

    // More games (exclude current)
    const moreGrid = document.getElementById('more-games-grid');
    ALL_GAMES.filter(g => g.id !== gameId).forEach(g => {
      const a = document.createElement('a');
      a.className = 'more-card';
      a.href = `/game.html?game=${g.id}`;
      a.innerHTML = `<div><div class="more-card-name">${g.name}</div><div class="more-card-cta">Play →</div></div>`;
      moreGrid.appendChild(a);
    });

    // Fullscreen button — fullscreen just the game, not the ad rails
    const gameWrapper = document.querySelector('.game-wrapper');
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (gameWrapper.requestFullscreen) gameWrapper.requestFullscreen();
      else if (gameWrapper.webkitRequestFullscreen) gameWrapper.webkitRequestFullscreen();
    });

    // Hide scroll hint once user scrolls
    const scrollHint = document.getElementById('scroll-hint');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 20) scrollHint.style.opacity = '0';
      else scrollHint.style.opacity = '1';
    }, { passive: true });
  </script>

</body>
</html>
