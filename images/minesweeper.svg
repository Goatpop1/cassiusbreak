<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="bgMine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C2240"/>
      <stop offset="1" stop-color="#06121e"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bgMine)"/>
  <g>
    <!-- 3x3 grid of cells -->
    <g fill="#163258" stroke="#0a1a30" stroke-width="2">
      <rect x="100" y="40"  width="40" height="40" rx="4"/>
      <rect x="140" y="40"  width="40" height="40" rx="4"/>
      <rect x="180" y="40"  width="40" height="40" rx="4"/>
      <rect x="100" y="80"  width="40" height="40" rx="4" fill="#0e2038"/>
      <rect x="140" y="80"  width="40" height="40" rx="4"/>
      <rect x="180" y="80"  width="40" height="40" rx="4"/>
      <rect x="100" y="120" width="40" height="40" rx="4"/>
      <rect x="140" y="120" width="40" height="40" rx="4"/>
      <rect x="180" y="120" width="40" height="40" rx="4" fill="#0e2038"/>
    </g>
    <!-- number -->
    <text x="120" y="108" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="24" fill="#50D8FF" text-anchor="middle">2</text>
    <!-- flag -->
    <g transform="translate(150 50)">
      <rect x="6" y="0" width="2.5" height="20" fill="#90C4E8"/>
      <polygon points="8.5,1 20,5 8.5,9" fill="#ff5a5f"/>
    </g>
    <!-- mine -->
    <g transform="translate(200 140)">
      <circle r="11" fill="#0b0b12"/>
      <g stroke="#0b0b12" stroke-width="3">
        <line x1="-15" y1="0" x2="15" y2="0"/>
        <line x1="0" y1="-15" x2="0" y2="15"/>
        <line x1="-11" y1="-11" x2="11" y2="11"/>
        <line x1="-11" y1="11" x2="11" y2="-11"/>
      </g>
      <circle cx="-3" cy="-3" r="3" fill="#90C4E8"/>
    </g>
  </g>
</svg>
